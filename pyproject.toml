[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acceptance-agent"
version = "0.1.0"
description = "Acceptance evidence agent core, CLI, and API adapters"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "python-docx>=1.1.2,<2.0",
  "openai>=1.54.0,<2.0",
  "httpx>=0.28.0,<1.0",
  "typer>=0.15.0,<1.0",
  "pydantic>=2.0,<3.0",
]

[project.scripts]
acceptance-agent = "cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_core*", "cli*", "apps.api.app*"]
